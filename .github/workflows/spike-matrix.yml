# The standing cross-OS determinism gate (PLAN B4), born at P1.5.
#
# WHAT THIS PROVES
#
# One question, asked of real bytes on three operating systems: **does the same
# change measure to the same per-result digests everywhere?** PREMORTEM T1 rates
# a "no" as fatal — CRLF worktrees against LF checkouts, unpinned system git,
# and randomized map iteration each independently break the digest compare, and
# a trust tool whose headline verdict fires falsely on honest work has no second
# chance. Every engine phase from P2 onward joins these fixtures (PLAN P2/P3/P4
# shared-files rows), which is why the workflow is theirs to extend rather than
# a P1.5 artifact.
#
# WHO HAS JOINED
#
#   P1.5  the spike's three byte counts, over `fixtures/honest/determinism`.
#   P2    the static family — size, cyclomatic and cognitive complexity, and
#         parse health — over `crates/engines/static-metrics/fixtures/matrix.toml`.
#
# A joining phase brings its own fixture and its own legs rather than adding
# files to somebody else's fixture. The two fixtures answer the same question
# about different engines, and a shared one would mean a P3 change could turn a
# P1.5 leg red. What is shared is the comparator: `andon-spike compare-records`
# reads a `MeasurementRecord` and cares nothing about which engine produced it,
# so every joining phase's digests are held to one tested implementation of
# "byte-identical", with one set of failure messages.
#
# P2's fixture carries a deliberately-unparsable file, and that is load-bearing
# rather than decorative: `completeness: parse-degraded` is INSIDE the per-result
# digest input, so the matrix proves three operating systems agree about *which*
# file the parser failed on and by how much — not merely that clean files agree.
#
# EXECUTION MODE: dispatch-at-gates (user decision D2)
#
# `push` runs one cheap Linux job. The three-OS legs run on `workflow_dispatch`
# at each phase-review gate — "standing" means required green at every gate, not
# on every push. That reconciles the standing-matrix requirement with the
# Actions conserve rule at zero new spend, and it matters most for macOS, which
# bills ten minutes for every one.
#
# There is no commit-message escape hatch. One was added on the theory that a
# workflow living only on a feature branch might not be dispatchable before it
# reached the default branch; that theory was tested and is false —
# `gh workflow run --ref <branch>` works on an unmerged branch. A second way to
# trigger the expensive legs, justified by a hazard that does not exist, is a
# second policy for someone to mistake for the first.
#
# WHY THE FIXTURE IS BUILT ONCE AND SHIPPED
#
# Per-result digests bind `(base_oid, head_oid)`. Building the fixture
# separately on each leg would make the comparison depend on three operating
# systems producing byte-identical commit OIDs — a second determinism claim,
# nested inside the one under test, failing the same way and telling you
# nothing about which. So one Linux job builds it, ships it as a bare
# repository, and every leg clones the same objects.
#
# Each leg then clones **with its runner's own git config**. On Windows that
# means `core.autocrlf=true` and a working tree full of CRLF nobody committed —
# PREMORTEM Story 1's exact setup. The compared lane reads blobs, so the digest
# does not notice. The `worktree vs blob` step prints both so the mangling is
# visible in the log rather than asserted in a comment.

name: spike-matrix

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FIXTURE_MANIFEST: fixtures/honest/determinism/manifest.toml

jobs:
  # ---------------------------------------------------------------- push tier
  linux-self-check:
    name: linux self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The whole verdict set, the T4 concurrency and squash fixture, and the
      # binary-separation guard. Cheap, Linux, and the thing that catches a
      # broken kernel before anyone spends a macOS minute on it.
      - name: Verdict set, T4 fixture, separation guard
        run: cargo test -p andon-ledger-min -- --nocapture

      # The cheap two-thirds of the matrix. The fixture builder pins commit
      # identity and timestamps, so the determinism fixture has the same commit
      # OIDs everywhere — which means this job's digest table can be diffed
      # against one produced on a developer's machine without spending a paid
      # runner minute. Two operating systems agreeing is not the gate, but it is
      # the cheapest way to find out that the third will not, before dispatching
      # the sweep that bills macOS at ten times the rate.
      - name: Determinism fixture digests (cross-check surface)
        run: |
          set -euo pipefail
          spike() { cargo run -q -p andon-ledger-min --bin andon-spike -- "$@"; }
          spike scenario prepare \
            --manifest "$FIXTURE_MANIFEST" --dest fixture-src --json fixture.json
          head="$(jq -r .head fixture.json)"
          spike measure --repo fixture-src --base merge-base:main \
            --head "$head" --no-note --quiet --out record-linux.json
          spike digests --record record-linux.json

      # P2's join, at the same tier and for the same reason: the cheapest place
      # to find out that the expensive sweep will fail. The static engine has far
      # more moving parts than the spike's byte counts — four grammars, a
      # tree-sitter runtime, and a tree walk per file — so a Linux-only digest
      # table on every push is worth its seconds.
      - name: Static-metrics fixture digests (cross-check surface)
        run: |
          set -euo pipefail
          static() { cargo run -q -p andon-static-metrics --bin andon-static -- "$@"; }
          spike() { cargo run -q -p andon-ledger-min --bin andon-spike -- "$@"; }
          static fixture --dest static-fixture-src --json static-fixture.json
          static measure \
            --repo static-fixture-src \
            --base "$(jq -r .base static-fixture.json)" \
            --head "$(jq -r .head static-fixture.json)" \
            --out record-static-linux.json
          spike digests --record record-static-linux.json

  # ----------------------------------------------------------- dispatch tier
  build-fixture:
    name: build the determinism fixture
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      head: ${{ steps.fixture.outputs.head }}
      trusted-branch: ${{ steps.fixture.outputs.trusted_branch }}
      expect-results: ${{ steps.fixture.outputs.expect_results }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the spike binaries
        run: cargo build --release -p andon-ledger-min

      - name: Build and pack the fixture
        id: fixture
        run: |
          set -euo pipefail
          ./target/release/andon-spike scenario prepare \
            --manifest "$FIXTURE_MANIFEST" \
            --dest fixture-src \
            --json fixture.json
          echo "head=$(jq -r .head fixture.json)" >> "$GITHUB_OUTPUT"
          echo "trusted_branch=$(jq -r .trusted_branch fixture.json)" >> "$GITHUB_OUTPUT"
          # The floor comes from the manifest, never from what this run
          # happened to measure. `jq -e` fails the step if the manifest does
          # not declare one, so the assertion cannot quietly become optional.
          echo "expect_results=$(jq -e -r .expect_result_count fixture.json)" >> "$GITHUB_OUTPUT"

          # `--mirror` so every ref travels, then the ledger refs are dropped:
          # each leg must write its OWN self-report, and shipping the Linux
          # one would give the other legs a note to agree with rather than a
          # measurement to make.
          git clone --quiet --mirror fixture-src determinism.git
          for ref in refs/notes/andon-measure refs/notes/andon-attest; do
            git --git-dir=determinism.git update-ref -d "$ref" || true
          done
          git --git-dir=determinism.git symbolic-ref HEAD \
            "refs/heads/$(jq -r .trusted_branch fixture.json)"
          tar -czf determinism.tar.gz determinism.git

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: determinism-fixture
          path: |
            determinism.tar.gz
            fixture.json
          retention-days: 7

  agent-measure:
    name: agent measure (${{ matrix.os }})
    needs: build-fixture
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the spike binaries
        run: cargo build --release -p andon-ledger-min

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: determinism-fixture

      # No `$RUNNER_TEMP`: on Windows it is a backslash path, and every path in
      # this job goes through bash. The workspace is a forward-slash path on all
      # three runners.
      - name: Clone the fixture with this runner's own git config
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf determinism.tar.gz
          git clone --quiet determinism.git work
          echo "--- what this runner's git does to a checkout ---"
          git config --show-origin --get core.autocrlf || echo "core.autocrlf: unset"
          git -C work config --show-origin --get core.eol || echo "core.eol: unset"

      # Whether this runner mangled the checkout, in one line and in git's own
      # terms: the committed blob OID against the OID of the bytes now on disk,
      # hashed with every filter off. Printed rather than asserted — a green
      # matrix must not depend on a runner image's git config staying the way it
      # is today — but printed as a *computed answer* rather than as two hexdumps
      # for a human to compare in a log viewer.
      - name: Did this checkout change the bytes?
        shell: bash
        run: |
          set -euo pipefail
          for path in src/lf.ts src/crlf.ts src/mixed.ts; do
            committed="$(git -C work rev-parse "HEAD:$path")"
            on_disk="$(git -C work hash-object --no-filters "$path")"
            if [ "$committed" = "$on_disk" ]; then
              echo "unchanged  $path  $committed"
            else
              echo "MANGLED    $path  blob=$committed disk=$on_disk"
            fi
          done
          echo
          echo "A MANGLED line is PREMORTEM Story 1's setup, reproduced: the"
          echo "working tree is not what was committed. The compared lane reads"
          echo "blobs, so the digests below must agree with the other legs"
          echo "regardless of which lines above say what."

      - name: Measure
        shell: bash
        env:
          HEAD_SHA: ${{ needs.build-fixture.outputs.head }}
        run: |
          set -euo pipefail
          spike=./target/release/andon-spike
          [ -x "$spike" ] || spike="${spike}.exe"
          "$spike" measure \
            --repo work \
            --base "merge-base:origin/${{ needs.build-fixture.outputs.trusted-branch }}" \
            --head "$HEAD_SHA" \
            --out "record-${{ matrix.os }}.json"
          echo "--- record ---"
          cat "record-${{ matrix.os }}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: record-${{ matrix.os }}
          path: record-${{ matrix.os }}.json
          retention-days: 7

  verifier-recompute:
    name: linux verifier recompute and digest equality
    needs: [build-fixture, agent-measure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the spike binaries
        run: cargo build --release -p andon-ledger-min

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: legs

      - name: Recompute as the verifier
        env:
          HEAD_SHA: ${{ needs.build-fixture.outputs.head }}
        run: |
          set -euo pipefail
          tar -xzf legs/determinism-fixture/determinism.tar.gz
          git clone --quiet determinism.git verifier-work
          ./target/release/andon-spike measure \
            --repo verifier-work \
            --base "merge-base:origin/${{ needs.build-fixture.outputs.trusted-branch }}" \
            --head "$HEAD_SHA" \
            --no-note \
            --out record-verifier.json

      # The assertion the whole workflow exists for. Per-result digests only:
      # `freshness.measured_at`, `compare_context.git_version` and
      # `tool.build_oid` differ between honest machines by construction and are
      # outside the digest input for that reason.
      - name: Per-result digests must be byte-identical
        run: |
          set -euo pipefail
          ./target/release/andon-spike compare-records \
            --leg linux=legs/record-ubuntu-latest/record-ubuntu-latest.json \
            --leg macos=legs/record-macos-latest/record-macos-latest.json \
            --leg windows=legs/record-windows-latest/record-windows-latest.json \
            --leg verifier=record-verifier.json             --expect-results "${{ needs.build-fixture.outputs.expect-results }}"

  # ============================================================= P2's join ===
  #
  # Same three questions as the spike's legs, asked of the static family:
  #
  #   build once, ship          so the comparison does not depend on three
  #                             operating systems producing identical commit
  #                             OIDs — a second determinism claim nested inside
  #                             the one under test.
  #   clone with the runner's   so a Windows leg gets the CRLF working tree its
  #     own git config          own git insists on, and the blobs stay what was
  #                             committed.
  #   compare per-result        `freshness.measured_at`, `git_version` and
  #     digests only            `build_oid` differ between honest machines by
  #                             construction.

  build-static-fixture:
    name: build the static-metrics fixture
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      base: ${{ steps.fixture.outputs.base }}
      head: ${{ steps.fixture.outputs.head }}
      expect-results: ${{ steps.fixture.outputs.expect_results }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the harness
        run: cargo build --release -p andon-static-metrics --bin andon-static

      - name: Build and pack the fixture
        id: fixture
        run: |
          set -euo pipefail
          ./target/release/andon-static fixture \
            --dest static-fixture-src \
            --json static-fixture.json
          echo "base=$(jq -r .base static-fixture.json)" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head static-fixture.json)" >> "$GITHUB_OUTPUT"
          # The floor comes from the fixture manifest, never from what this run
          # happened to measure. `jq -e` fails the step if it is absent, so the
          # assertion cannot quietly become optional.
          echo "expect_results=$(jq -e -r .expect_result_count static-fixture.json)" >> "$GITHUB_OUTPUT"

          git clone --quiet --mirror static-fixture-src static-determinism.git
          git --git-dir=static-determinism.git symbolic-ref HEAD refs/heads/main
          tar -czf static-determinism.tar.gz static-determinism.git

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-determinism-fixture
          path: |
            static-determinism.tar.gz
            static-fixture.json
          retention-days: 7

  static-measure:
    name: static measure (${{ matrix.os }})
    needs: build-static-fixture
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the harness
        run: cargo build --release -p andon-static-metrics --bin andon-static

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-determinism-fixture

      # No `$RUNNER_TEMP`: on Windows it is a backslash path, and every path in
      # this job goes through bash.
      - name: Clone the fixture with this runner's own git config
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf static-determinism.tar.gz
          git clone --quiet static-determinism.git work
          git config --show-origin --get core.autocrlf || echo "core.autocrlf: unset"

      # Whether this runner mangled the checkout, in git's own terms: the
      # committed blob OID against the OID of the bytes now on disk, hashed with
      # every filter off. Printed rather than asserted — a green matrix must not
      # depend on a runner image's git config staying as it is today.
      - name: Did this checkout change the bytes?
        shell: bash
        run: |
          set -euo pipefail
          for path in src/clean.ts src/crlf.ts src/mixed.py src/broken.ts; do
            committed="$(git -C work rev-parse "HEAD:$path")"
            on_disk="$(git -C work hash-object --no-filters "$path")"
            if [ "$committed" = "$on_disk" ]; then
              echo "unchanged  $path  $committed"
            else
              echo "MANGLED    $path  blob=$committed disk=$on_disk"
            fi
          done
          echo
          echo "A MANGLED line is PREMORTEM Story 1's setup, reproduced. The"
          echo "static engine parses blob bytes, so the digests below must agree"
          echo "with the other legs regardless of which lines above say what --"
          echo "including the parse-degraded ones, whose completeness is inside"
          echo "the digest input."

      - name: Measure
        shell: bash
        env:
          BASE_SHA: ${{ needs.build-static-fixture.outputs.base }}
          HEAD_SHA: ${{ needs.build-static-fixture.outputs.head }}
        run: |
          set -euo pipefail
          bin=./target/release/andon-static
          [ -x "$bin" ] || bin="${bin}.exe"
          "$bin" measure \
            --repo work \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --out "record-static-${{ matrix.os }}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: record-static-${{ matrix.os }}
          path: record-static-${{ matrix.os }}.json
          retention-days: 7

  static-digest-equality:
    name: static-metrics digests must be byte-identical
    needs: [build-static-fixture, static-measure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Two binaries: the P2 harness to recompute, and the spike's comparator.
      # `compare-records` reads a `MeasurementRecord` and does not care which
      # engine produced it, so P2 reuses it rather than shipping a second
      # cross-leg comparison with its own failure messages.
      - name: Build the harness and the comparator
        run: |
          cargo build --release -p andon-static-metrics --bin andon-static
          cargo build --release -p andon-ledger-min --bin andon-spike

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: legs

      - name: Recompute as the verifier
        env:
          BASE_SHA: ${{ needs.build-static-fixture.outputs.base }}
          HEAD_SHA: ${{ needs.build-static-fixture.outputs.head }}
        run: |
          set -euo pipefail
          tar -xzf legs/static-determinism-fixture/static-determinism.tar.gz
          git clone --quiet static-determinism.git verifier-work
          ./target/release/andon-static measure \
            --repo verifier-work \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --out record-static-verifier.json

      - name: Per-result digests must be byte-identical
        run: |
          set -euo pipefail
          ./target/release/andon-spike compare-records \
            --leg linux=legs/record-static-ubuntu-latest/record-static-ubuntu-latest.json \
            --leg macos=legs/record-static-macos-latest/record-static-macos-latest.json \
            --leg windows=legs/record-static-windows-latest/record-static-windows-latest.json \
            --leg verifier=record-static-verifier.json \
            --expect-results "${{ needs.build-static-fixture.outputs.expect-results }}"

      # The digest table proves the numbers agree. This proves they agree about
      # the *degraded* file specifically — the assertion the parse-health half of
      # P2 rests on, and the one a reader of a green matrix would otherwise have
      # to infer from a row count.
      - name: Every leg must agree that src/broken.ts was degraded
        run: |
          set -euo pipefail
          for leg in ubuntu-latest macos-latest windows-latest; do
            file="legs/record-static-${leg}/record-static-${leg}.json"
            count=$(jq '[.results[]
              | select(.scope.path == "src/broken.ts")
              | select(.completeness == "parse-degraded")] | length' "$file")
            echo "$leg: $count parse-degraded result(s) on src/broken.ts"
            [ "$count" -gt 0 ] || {
              echo "::error::$leg did not mark src/broken.ts as parse-degraded" >&2
              exit 1
            }
          done

  scenarios:
    name: verdict set (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # "honest -> `confirmed` on every matrix leg" (PLAN B5) is a claim about
      # every leg, so the whole verdict set runs on every leg. The should-fail
      # rows come along for free and are worth having: a tamper detector that
      # only catches things on Linux is not a tamper detector.
      - name: The verdict set, on this OS
        run: cargo test -p andon-ledger-min -- --nocapture

  # Linux, and therefore on push: D2 puts Linux checks on every push and holds
  # only the macOS and Windows legs back for dispatch. This job is where the
  # verdicts come out of the composite action's YAML rather than out of a Rust
  # test calling the same functions, and that is worth having as a standing
  # push gate — the first version of the action failed to load at all, and a
  # dispatch-only job would have hidden that until the gate run.
  action-smoke:
    name: through the action (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hand-enumerated because a matrix cannot read a directory, and
          # therefore guarded: `tests/verdict_set.rs` asserts this list equals
          # what is on disk. A fixture added without a line here would be tested
          # in-process and never through the action's YAML — green, and silently
          # narrower than it reads.
          #
          # The first leg deliberately omits `spike-bin`, so the action's own
          # build step is exercised rather than only its verify step.
          - scenario: determinism
            family: honest
            prebuilt: false
          - scenario: moving-main
            family: honest
            prebuilt: true
          - scenario: rebased-pr
            family: honest
            prebuilt: true
          - scenario: version-skew
            family: honest
            prebuilt: true
          - scenario: inflated-metric
            family: gamed
            prebuilt: true
          - scenario: flipped-deterministic
            family: gamed
            prebuilt: true
          - scenario: flipped-one-deterministic
            family: gamed
            prebuilt: true
          - scenario: fabricated-base
            family: gamed
            prebuilt: true
          - scenario: skewed-forge
            family: gamed
            prebuilt: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the spike binaries
        run: cargo build --release -p andon-ledger-min

      # Stage the scenario: build the repository, run the agent-side
      # measurement, and let the adversary do its work where the manifest says
      # so. Everything up to the point CI takes over.
      - name: Prepare
        id: prepare
        run: |
          set -euo pipefail
          ./target/release/andon-spike scenario prepare \
            --manifest "fixtures/${{ matrix.family }}/${{ matrix.scenario }}/manifest.toml" \
            --dest "scenario-repo" \
            --json scenario.json
          echo "head=$(jq -r .head scenario.json)" >> "$GITHUB_OUTPUT"
          echo "trusted=$(jq -r .trusted_branch scenario.json)" >> "$GITHUB_OUTPUT"

      # The point of this job: the verdict comes out of the composite action,
      # through its YAML, not out of a Rust test calling the same functions.
      - name: Attest
        id: attest
        uses: ./action
        with:
          repo-path: scenario-repo
          head-sha: ${{ steps.prepare.outputs.head }}
          trusted-branch: ${{ steps.prepare.outputs.trusted }}
          spike-bin: ${{ matrix.prebuilt && './target/release/andon-spike' || '' }}

      # Read back the note the action actually wrote and hold it against the
      # expectation committed in the manifest. Checking the step output alone
      # would prove the action returned a string; this proves the ledger says so.
      - name: The attest note must match the committed expectation
        run: |
          set -euo pipefail
          echo "action reported: ${{ steps.attest.outputs.attestation }}"
          ./target/release/andon-spike scenario check \
            --manifest "fixtures/${{ matrix.family }}/${{ matrix.scenario }}/manifest.toml" \
            --repo scenario-repo
