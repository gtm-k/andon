# Andon CI.
#
# Execution strategy is user decision D2, "dispatch-at-gates": Linux checks run
# on every push; the macOS and Windows matrix legs and the perf gate run via
# workflow_dispatch at each phase-review gate. The cross-OS matrix is still a
# hard gate — "standing" means required green at every gate, not on every push.
# That reconciles the standing-matrix requirement with conserving Actions
# minutes, at no new spend.
#
# The matrix legs themselves arrive with P1.5 (spike-matrix.yml) and the perf
# gate with P1 (perf.yml). This file carries the checks that exist from P0.
#
# Every third-party action in this file — including GitHub's own — is pinned by
# commit SHA with the tag in a trailing comment, never by the tag itself. A tag
# is a mutable pointer that whoever controls the repository can move to new
# code, and these actions run with a token in a project whose product is trust.
# The comment says which release the SHA was, so an upgrade is still legible in
# a diff.

name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately no `RUSTFLAGS: -D warnings` here: RUSTFLAGS applies to
  # dependencies too, so a warning in someone else's crate would fail our build
  # and a flag change would invalidate the whole cache. Warnings are denied
  # where they belong instead — `#![deny(missing_docs)]` in andon-core and the
  # explicit `-D warnings` on the clippy step.

jobs:
  checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the version; this only adds the components.
      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--no-fail-fast` so one red suite cannot abort the run and hide every
      # suite after it. This job is often the only Linux run a change gets, and
      # a suite that never executed is a silent failure for whoever needed its
      # answer; the job still fails on any red, it just reports all of them.
      - name: Test
        run: cargo test --workspace --no-fail-fast

  registry-lint:
    name: evidence registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Required green from P2 onward, and runnable from P0. It passes over an
      # empty registry and says so, so this job is meaningful from the first
      # commit rather than red until the first engine ships.
      - name: Registry lint
        run: cargo run -p andon-registry-lint -- --policy .andon.toml registry/

  supply-chain:
    name: licence and source gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installed from a release binary rather than `cargo install` (which
      # compiles for minutes) and rather than a third-party action (an
      # unreviewed dependency in a repository whose product is trust). The
      # version is pinned so the gate cannot change under us.
      #
      # A pinned version is not a pinned artifact: a release asset can be
      # deleted and re-uploaded under the same tag, and the fetch itself is one
      # more thing to trust. The checksum below is the artifact pin, verified
      # before extraction so a substituted tarball is never unpacked, let alone
      # run. `set -euo pipefail` makes the check fail the job.
      #
      # Recorded 2026-08-17 from the published asset, cross-checked against the
      # `digest` field GitHub's own release API reports for it. Recompute when
      # CARGO_DENY_VERSION changes; the two must move together.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz" \
            -o cargo-deny.tar.gz
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          install -m 0755 "${archive}/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version

      # All three sections deny.toml configures, not just licences. Running one
      # of three left [bans] and [sources] as documentation: a git-sourced
      # dependency passed this job while deny.toml said `unknown-git = "deny"`.
      #
      # licenses: permissive only — a hard constraint from PRE-DECISIONS, not
      #   hygiene. Unknown licences fail; an undetected licence is a licence
      #   problem, not a gap to wave through.
      # bans:     no wildcard versions, so the build is pinned.
      # sources:  crates.io only, so no dependency can be repointed after review.
      - name: Licence, bans, and source gate
        run: cargo deny check licenses bans sources

  self-measure:
    name: self-measure (bootstrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history. The default shallow checkout leaves no earlier state
          # for the base ladder to resolve, and `andon measure` refuses a
          # shallow clone rather than recompute over history it cannot see —
          # the verifier's own unshallow rule, biting this repository's CI.
          # The refusal was honest; the depth was the defect. dogfood.yml's
          # checkout says the same thing at more length.
          fetch-depth: 0

      # P5b's dogfood switch-on replaced the P0 placeholder this step used to
      # run: scripts/self-measure.sh now builds the working tree's binary and
      # measures the repository with it, under the recorded
      # bootstrap-no-attested-release override. dogfood.yml drives the same
      # script with the ledger regression test and the typed gate beside it.
      # See docs/self-measure.md.
      - name: Self-measure
        run: bash scripts/self-measure.sh

  engines-change:
    name: engines change gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Two commits is enough to diff a push against its parent.
          fetch-depth: 2

      # Changed paths are computed with plain git rather than a third-party
      # path-filter action, for the same reason cargo-deny is not one.
      #
      # Fail-closed: when the base is unknown or unreachable — a first push, a
      # force push, a multi-commit push whose parent was not fetched — this runs
      # the gate rather than skipping it. Skipping is the expensive mistake: an
      # engine change would slip past the check silently, whereas a needless run
      # only costs minutes.
      #
      # `github.event.before` reaches the script through `env:` rather than
      # `${{ }}` interpolation. Direct interpolation pastes the value into the
      # shell source before bash parses it, so anything shell-significant in it
      # is executed rather than read; going through the environment means the
      # script only ever sees it as data. It is a SHA today, but the safety of
      # this step should not rest on a payload field's format.
      - name: Detect engine changes
        id: detect
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          before="${PUSH_BEFORE:-}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            base="$before"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi

          if [ -z "$base" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Base commit unknown; running the gate rather than skipping it."
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD -- 'crates/engines/**')"
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Engine files changed since ${base}:"; echo "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No engine files changed since ${base}."
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.detect.outputs.changed == 'true'

      # The golden-set comparison. P0 wired this bridge before the golden set
      # existed and left it hard-failing on purpose, so the first engine change
      # could not land before someone remembered to add the comparison. P5b
      # created `fixtures/golden`, so the comparison is now here and the
      # tripwire is spent.
      #
      # WHAT RUNS, AND THE HALF THAT CANNOT YET
      #
      # docs/self-measure.md describes a *two-binary* comparison: the last
      # attested release binary and the working tree's binary measure the same
      # fixtures, and their answers are compared, so that a difference is the
      # intended output of an engine change rather than something a reviewer has
      # to spot. No attested release exists yet — the same
      # `bootstrap-no-attested-release` override the self-measure job records —
      # so there is only one binary to run.
      #
      # What runs instead is that one binary against the committed reference
      # payloads, which detects the same class of change with one fewer party:
      # an engine edit that moves a number reddens here and the reviewer sees
      # exactly which numbers moved. What it cannot do is tell an intended
      # change from an accidental one *without* the reviewer, because the
      # reference payloads live in the same commit as the change. The second
      # binary is what closes that, and it arrives with the first attested
      # release.
      #
      # The mode is announced either way, so "did the real comparison run?" is
      # answered by the log rather than by reading this file.
      - name: Golden-set comparison
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ ! -d fixtures/golden ]; then
            echo "ERROR: fixtures/golden is missing." >&2
            echo "       P5b created it and this gate depends on it; a deletion is a" >&2
            echo "       silent loss of the only comparison an engine change gets." >&2
            exit 1
          fi
          echo "MODE: golden-set comparison against committed reference payloads."
          echo "      The two-binary half is unavailable: no attested release exists yet"
          echo "      (override bootstrap-no-attested-release, docs/self-measure.md)."
          cargo test -p andon-cli --test golden -- --nocapture
          cargo test --workspace
