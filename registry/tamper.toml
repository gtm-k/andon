deterministic = true

[[claim]]
claim_id = "andon.tamper.assertion-free-test@1|any|unverified-test"
implementation = "andon.tamper.assertion-free-test"
implementation_version = "1"
language = "any"
outcome = "unverified-test"
tier = "N"
citation = "Novel. Motivated by the test-smell literature — van Deursen, Moonen, van den Bergh and Kok, 'Refactoring Test Code', XP 2001, which named assertion problems as a test smell — but that work describes smells qualitatively and validates nothing about this detector."
population = "none — calibrated against Andon's own corpus v1"
effect = "none claimed; the count of test cases the change adds, or edits into existence, whose bodies contain no assertion-shaped call"
does_not_predict = [
    "that the test is worthless — a smoke test that only checks a call does not throw is a real test",
    "coverage adequacy",
    "defect-detection ability of the suite",
    "tests whose assertions are hidden behind a helper this detector cannot recognise",
]
owner = "gtm-k"
expiry = "2027-05-17"

