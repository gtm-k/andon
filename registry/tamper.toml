implementation_version = "1"
language = "any"
outcome = "analysis-suppression"
tier = "N"
citation = "Novel. No study underlies it. Motivated by the observation that a suppression comment is the cheapest way to make a static finding disappear without changing the code it is about."
population = "none — calibrated against Andon's own corpus v1"
effect = "none claimed; the net count of linter and type-checker suppression directives added, fired only when the count rises by at least two and the per-line density rises with it"
