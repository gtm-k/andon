# Evidence registry for the tamper-detector suite (P3).
#
# FOUR CLAIMS, SEVEN DETECTORS, FOURTEEN METRICS
# ----------------------------------------------
# One claim per *outcome*, not one per detector. The seven detectors answer four
# questions, and two detectors asking the same question by different mechanisms
# do not need two evidence claims:
#
#   test-evidence-withdrawal  the suite verifies less than it did
#                             <- test-removal, assertion-free-test
#   analysis-blind-spot       code the static engines can no longer see
#                             <- suppression-density, parse-error-delta
#   quality-gate-loosening    the bar moved instead of the code
#                             <- coverage-exclusion-drift, threshold-config-edit
#   hard-coded-answers        an implementation replaced by the tested inputs
#                             <- lookup-table-blowup
#
# The detectors stay seven and separable — each has its own metric pair, its own
# severity, and its own row in the precision/recall table. What is shared is the
# evidence story, because it is genuinely one story per outcome.
#
# WHY MERGING IS HONEST HERE AND WOULD NOT BE ELSEWHERE
# -----------------------------------------------------
# The hazard a narrow claim tuple guards against is *evidence* overstatement:
# attributing a study about one measurement to a family of measurements, which
# is how "cyclomatic complexity predicts defects" gets said. There is no study
# here to stretch. Every claim below is tier N with `population` naming a
# constructed corpus, so the merge borrows nothing it has not earned — and
# `effect` enumerates exactly what each metric counts, so no reader has to
# guess which detector a number came from.
#
# WHAT THE EVIDENCE ACTUALLY IS
# -----------------------------
# Andon's own adversarial corpus, and it is cited as what it is. 102 constructed
# changes — 51 that must fire and 51 that must not — frozen before the detectors
# were measured against them, with per-detector precision and recall floors set
# ex ante at 0.80 and 0.70. Every detector clears both; the live table is in
# `fixtures/adversarial/README.md` and `tests/corpus_floors.rs` fails the build
# if it stops being the table the code produces.
#
# The floors, not the measured figures, are what these claims state. A figure
# copied here would rot the first time a grammar moved, which is the registry
# failure of PREMORTEM S2 arriving in the registry itself; the floors are gated
# by a test, so the claim stays true or the build goes red.
#
# `citation_ref` is absent throughout: the P10a registry gate resolves DOIs
# automatically, and an unverified identifier written from memory is a worse
# artefact than a named source with no identifier, because the first looks
# checked.

schema_version = 1
engine = "tamper"
family = "tamper"

# ------------------------------------------------- test-evidence withdrawal
# Two detectors, one outcome: after this change the suite checks less than it
# did. One counts cases that left the run, the other counts cases that stayed
# and stopped asserting.

[[metric]]
metric_id = "tamper.test-removal"
claim_id = "andon.tamper.test-evidence@1|any|test-evidence-withdrawal"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.test-removal.magnitude"
claim_id = "andon.tamper.test-evidence@1|any|test-evidence-withdrawal"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.assertion-free-test"
claim_id = "andon.tamper.test-evidence@1|any|test-evidence-withdrawal"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.assertion-free-test.magnitude"
claim_id = "andon.tamper.test-evidence@1|any|test-evidence-withdrawal"
class = "diff-actionable"
deterministic = true

[[claim]]
claim_id = "andon.tamper.test-evidence@1|any|test-evidence-withdrawal"
implementation = "andon.tamper.test-evidence"
implementation_version = "1"
language = "any"
outcome = "test-evidence-withdrawal"
tier = "N"
citation = "Novel. Calibrated against Andon's own adversarial corpus v1 (fixtures/adversarial, frozen 2026-08-17, digest 9aa97c6d), not against a study. Motivated by PREMORTEM S1 — a measured system whose tests are also the measurement's subject can be improved by removing the subject — and, for the assertion half, by the test-smell literature (van Deursen, Moonen, van den Bergh and Kok, 'Refactoring Test Code', XP 2001), which describes smells qualitatively and validates nothing about this detector."
population = "102 constructed changes: 51 written to exhibit the behaviour and 51 written to look like it and not be. Not a field population, and not a sample of anything — the cases were chosen to test the rules, so the corpus says whether the rules do what they say and nothing about how often the behaviour occurs."
effect = "none claimed beyond detection. Two counts: the net test cases the change removes plus those it newly marks skipped, and the test cases it adds or edits into asserting nothing. Both detectors clear the ex-ante floors of 0.80 precision and 0.70 recall on corpus v1 — the measured table is in fixtures/adversarial/README.md and is gated by tests/corpus_floors.rs."
does_not_predict = [
    "that the removal was illegitimate — deleting the tests for a deleted feature is correct, and this signal cannot tell the two apart",
    "that an assertion-free case is worthless — a smoke test that checks a call does not throw is a real test",
    "defect density, or the quality of the tests that remain",
    "anything about tests in languages this engine has no grammar for, which are not counted at all",
    "how it behaves on a language this claim's own corpus barely covers. The should-pass half is the only source of the false-positive rate, and for these two detectors it is 8 TypeScript cases for `test-removal` — every case it has — and 6 TypeScript beside 1 Python for `assertion-free-test`. No JavaScript case, no TSX case, for either. The claim tuple says `any` because the rules are written on node kinds rather than per-language branches, and the four grammars are read the same way; that is a statement about the MECHANISM. The precision figure is a statement about the EVIDENCE, and the evidence is one language",
    "anything about test cases the parser could not read — a case inside an ERROR region is not counted on either side, so a removal there is reported as no removal at all. Results over a file the parser did not finish are marked `parse-degraded` and the count is a lower bound (PREMORTEM T3)",
]
owner = "gtm-k"
expiry = "2027-05-17"

# ------------------------------------------------------- analysis blind spot
# Two detectors, one outcome: after this change there is code the static engines
# cannot read. One counts explicit directives that silence them, the other
# counts regions the parser could not read at all — deliberate or not.
#
# NO INCOMPLETE-PARSE CAVEAT HERE, AND THAT IS NOT AN OVERSIGHT
# ------------------------------------------------------------
# The other two claims in this file disclose that a region the parser could not
# read is a region their detectors never examined. Neither detector under this
# claim has that limitation, for opposite reasons. `suppression-density` scans
# bytes for recognised directives, and an ERROR node hides a comment from
# nobody. `parse-error-delta` *is* the report of the unreadable region: counting
# ERROR nodes over a tree full of them is exact, and qualifying it would qualify
# the one signal PREMORTEM T3 wants loud with the very thing it is reporting.
# Adding the caveat here anyway would be claiming a limitation this claim does
# not have, which is the same failure as hiding one.

[[metric]]
metric_id = "tamper.suppression-density"
claim_id = "andon.tamper.analysis-blind-spot@1|any|analysis-blind-spot"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.suppression-density.magnitude"
claim_id = "andon.tamper.analysis-blind-spot@1|any|analysis-blind-spot"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.parse-error-delta"
claim_id = "andon.tamper.analysis-blind-spot@1|any|analysis-blind-spot"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.parse-error-delta.magnitude"
claim_id = "andon.tamper.analysis-blind-spot@1|any|analysis-blind-spot"
class = "diff-actionable"
deterministic = true

[[claim]]
claim_id = "andon.tamper.analysis-blind-spot@1|any|analysis-blind-spot"
implementation = "andon.tamper.analysis-blind-spot"
implementation_version = "1"
language = "any"
outcome = "analysis-blind-spot"
tier = "N"
citation = "Novel. Calibrated against Andon's own adversarial corpus v1, not against a study. The parse half is named in Andon's own pre-mortem (PREMORTEM T3): tree-sitter ERROR and MISSING nodes hide code from every static engine, so a rising count is a rising blind spot. The suppression half rests on arithmetic rather than literature — a directive in a comment is the cheapest way to make a finding disappear without changing the code it is about."
population = "102 constructed changes: 51 written to exhibit the behaviour and 51 written to look like it and not be. Not a field population. The suppression half is deliberately blind below two added directives, which is a precision choice the should-pass corpus exists to justify."
effect = "none claimed beyond detection. Two counts: the net linter and type-checker suppression directives added, reported only when the count rises by at least two and the per-line density rises with it; and the net change in parser ERROR and MISSING nodes across the files a vendored grammar reads. Both clear the ex-ante floors of 0.80 precision and 0.70 recall on corpus v1 (table in fixtures/adversarial/README.md, gated by tests/corpus_floors.rs)."
does_not_predict = [
    "that either was deliberate — a documented suppression is normal practice, and a grammar older than a language feature produces parse faults on correct code",
    "that the suppressed findings were true positives, or that the unparseable code is wrong",
    "suppressions from tools outside the enumerated marker list — this is a list of recognised directives, not a general rule, and a linter absent from it is not counted",
    "defect density",
    "anything about files no vendored grammar reads, which are never counted as zero",
    "how it behaves on a language this claim's own corpus barely covers. The should-pass half is the only source of the false-positive rate, and for these two detectors it is 5 TypeScript beside 2 Python for `suppression-density`, and 5 TypeScript beside 1 JavaScript and 1 Rust for `parse-error-delta`. Better spread than the other tamper claims and still no TSX case, for either. The claim tuple says `any` about the MECHANISM — node kinds, not per-language branches — and the precision figure behind it is a statement about the EVIDENCE",
]
owner = "gtm-k"
expiry = "2027-07-19"

# ---------------------------------------------------- quality-gate loosening
# Two detectors, one outcome: the bar moved rather than the code. One widens
# what coverage declines to look at, the other lowers what a check will fail on.
# Both are advisory by PLAN.md round-1 B6 — a tool that blocks on policy edits
# has made policy evolution impossible, which is a worse failure than the one it
# prevents.
#
# No incomplete-parse caveat here either: both detectors read configuration
# files as text, and a tree-sitter ERROR node in a source file is not something
# a coverage config or a threshold setting can hide behind.
#
# What these two owe instead is the other honesty line. They decide for
# themselves which files are their subject, and a subject test that is a list of
# exact file names is a silent gap wearing a complete answer: `.nycrc.yml` and
# `.nycrc.json` are one tool's configuration and only one of them was in the
# list. Recognition is by the tool's stem read against the syntaxes that tool
# reads: open-ended for a dotfile stem nothing compiles, and narrowed to the
# default stem where the syntax is one a runtime executes and a further name
# segment would be somebody's module. Which edits inside a recognised file come
# back `partial` rather than as a number, and which shapes are still answered
# with a quiet zero, are both enumerated in the claim's `does_not_predict` —
# enumerated rather than promised, because the promise that stood here was
# broader than the code and six case families contradicted it.

[[metric]]
metric_id = "tamper.coverage-exclusion-drift"
claim_id = "andon.tamper.gate-loosening@1|any|quality-gate-loosening"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.coverage-exclusion-drift.magnitude"
claim_id = "andon.tamper.gate-loosening@1|any|quality-gate-loosening"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.threshold-config-edit"
claim_id = "andon.tamper.gate-loosening@1|any|quality-gate-loosening"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.threshold-config-edit.magnitude"
claim_id = "andon.tamper.gate-loosening@1|any|quality-gate-loosening"
class = "diff-actionable"
deterministic = true

[[claim]]
claim_id = "andon.tamper.gate-loosening@1|any|quality-gate-loosening"
implementation = "andon.tamper.gate-loosening"
implementation_version = "1"
language = "any"
outcome = "quality-gate-loosening"
tier = "N"
citation = "Novel. Calibrated against Andon's own adversarial corpus v1, not against a study. Motivated by the arithmetic: excluding a path raises a coverage percentage without testing anything, and lowering a threshold turns a red build green without changing the code that made it red. Both edits are one line in a file review rarely reaches."
population = "102 constructed changes: 51 written to exhibit the behaviour and 51 written to look like it and not be — the should-pass half deliberately includes reordered exclusion lists, tightened thresholds, and new settings with no prior value, which are the shapes a careless implementation fires on."
effect = "none claimed beyond detection. Two counts: the net exclusion entries added to recognised coverage configuration, and the recognised quality settings whose value moved in the loosening direction — a severity lowered, a strictness flag turned off, a floor reduced, an allowance raised. Both clear the ex-ante floors of 0.80 precision and 0.70 recall on corpus v1 (table in fixtures/adversarial/README.md, gated by tests/corpus_floors.rs)."
does_not_predict = [
    "that the loosening was unjustified — most are deliberate, which is why this outcome is reported advisory rather than blocking (round-1 B6)",
    "the effect of either edit on any downstream number",
    "defect density",
    "settings, formats, or keys these detectors do not recognise. What they recognise is the tool rather than the spelling — every syntax of a known tool's configuration file, and every key whose own name says it excludes — so the gap left is an unknown tool, not an unlisted extension of a known one. One narrowing is deliberate: a non-default config written in a JavaScript or TypeScript spelling a runtime executes (`jest.config.ci.ts`, `eslint.config.ci.mts`) is outside the subject, because in those syntaxes a further name segment is what an ordinary module is called and reading it accused test modules of the settings they assert about. The data spellings of the same variant — `jest.config.ci.json`, `tsconfig.ci.json`, `sonar-project.ci.properties` — are read",
    "a ranked answer for every edit inside a file they do read. The rule behind that is one sentence with one gate under it: where a detector reads a change inside its own subject and cannot decide it, both of its results come back `completeness: partial` instead. Five shapes reach that gate — a rule option that moved while its severity held; a setting these detectors model deleted rather than changed; a rule option written as a name that nothing in the file binds; a changed line the scanner took no setting from that carries a value of the kind they rank; and a coverage exclusion replaced by a pattern neither anchored above the other. A rule deleted rather than downgraded is the second of the five, and it stays a miss in the corpus recall column because unranked is not a firing",
    "a description of every undecided change, where one change leaves more than one. The caveat says how many went undecided and locates each as `file` or `file:line`, then quotes only the first in the detector's own words: the key and both values for an option that moved or that went behind a name, the key and the value it had for a deletion, the line's own text for an unread line — which carries no key to name, and is undecidable for that reason — and the replacing pattern alone for an exclusion replacement, never the pattern it replaced. The rest are located and not described",
    "four further shapes, which are read and answered `flag: false, magnitude: 0, completeness: complete` — a quiet zero and not a caveat. Each is measured on the shipped binary: a `.properties` value is read only as far as its first comma, so `sonar.coverage.exclusions` gaining entries after the first is invisible; an exclusion added in one file and an unrelated one removed in another net to zero across the change; a re-inclusion deleted from an exclusion list (`!src/api/**` dropped from `exclude`) puts that path back under exclusion; and a positive `collectCoverageFrom` inclusion narrowed (`src/**` to `src/core/**`) takes code out of coverage. Adding a negation, widening one, and widening an ordinary exclusion all do fire",
]
owner = "gtm-k"
expiry = "2027-08-16"

# -------------------------------------------------------- hard-coded answers
# One detector, one outcome, and no sibling: a table of the tested inputs
# standing where a computation was expected is a different kind of claim from
# the three above. It is about the implementation, not about the evidence
# around it.

[[metric]]
metric_id = "tamper.lookup-table-blowup"
claim_id = "andon.tamper.hard-coded-answers@1|any|hard-coded-answers"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.lookup-table-blowup.magnitude"
claim_id = "andon.tamper.hard-coded-answers@1|any|hard-coded-answers"
class = "diff-actionable"
deterministic = true

[[claim]]
claim_id = "andon.tamper.hard-coded-answers@1|any|hard-coded-answers"
implementation = "andon.tamper.hard-coded-answers"
implementation_version = "1"
language = "any"
outcome = "hard-coded-answers"
tier = "N"
citation = "Novel. Calibrated against Andon's own adversarial corpus v1, not against a study. Motivated by the shape a test-satisfying non-implementation takes: a table of the exact inputs the suite uses, consulted where a computation was expected. It passes every test and generalises to nothing."
population = "102 constructed changes: 51 written to exhibit the behaviour and 51 written to look like it and not be — the should-pass half includes module-level reference data, files under data directories, JSON, a long switch statement, an inline fixture table in a spec, and a literal one row under the threshold."
effect = "none claimed beyond detection. One count: the size of the largest literal collection of at least 24 entries the change adds inside a function body, in a file that is neither recognised data nor a test. Clears the ex-ante floors of 0.80 precision and 0.70 recall on corpus v1 (table in fixtures/adversarial/README.md, gated by tests/corpus_floors.rs)."
does_not_predict = [
    "that the table is wrong — precomputed tables are a legitimate optimisation",
    "algorithmic correctness or generality",
    "defect density",
    "tables assembled at run time rather than written as literals, which this detector cannot see",
    "tables inside a region the parser could not read, which are not seen at all — results over a file the parser did not finish are marked `parse-degraded` and the count is a lower bound (PREMORTEM T3)",
    "how it behaves outside TypeScript. Of this detector's 7 should-pass cases, 6 are TypeScript and the seventh is a JSON fixture — which exists to prove that data files do not fire, not to exercise a second grammar. So there is no Python, JavaScript or TSX case behind this claim's false-positive rate, and a literal-collection idiom common in those and rare in TypeScript would not have been seen by the number above",
]
owner = "gtm-k"
expiry = "2027-11-15"
