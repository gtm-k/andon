# Evidence registry for the tamper-detector suite (P3).
#
# WHY EVERY CLAIM HERE IS TIER N
# ------------------------------
# These seven detectors are novel. There is no literature that says "a change
# whose suppression density rose is more likely to be defective", because nobody
# has studied it — the failure mode they address (an optimizer with visibility
# into the metric) is younger than the evidence base. Tier N is the registry's
# word for exactly this standing: motivated by evidence, not yet supported by
# it. Claiming otherwise would be the overstatement the whole registry exists to
# make impossible, and it would be the *product's own* failure: a tool whose
# headline is "measurement that carries its evidence" cannot ship a detector
# with a borrowed citation.
#
# What each claim therefore predicts is narrow and mechanical: that the thing
# named was observed in the change. Whether the change was gamed is a judgement
# a human makes with the finding in front of them, and every `does_not_predict`
# says so.
#
# `citation_ref` is omitted throughout. An unverified DOI written from memory
# reads as checked and is not; the P10a registry gate resolves identifiers
# automatically, and citations that name their source in full are what a
# re-reviewer can actually act on before then.
#
# CALIBRATION
# -----------
# The precision and recall of each detector against the frozen corpus v1 are in
# `fixtures/adversarial/README.md`, measured by `andon-corpus-report` and gated
# at >= 0.80 precision / >= 0.70 recall by `tests/corpus_floors.rs`. Those are
# properties of the implementation, not of the claim, which is why they live
# with the corpus rather than in this file.

schema_version = 1
engine = "tamper"
family = "tamper"

# ---------------------------------------------------------------- test removal

[[metric]]
metric_id = "tamper.test-removal"
claim_id = "andon.tamper.test-removal@1|any|test-coverage-withdrawal"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "tamper.test-removal.magnitude"
claim_id = "andon.tamper.test-removal@1|any|test-coverage-withdrawal"
class = "diff-actionable"
deterministic = true

[[claim]]
claim_id = "andon.tamper.test-removal@1|any|test-coverage-withdrawal"
implementation = "andon.tamper.test-removal"
implementation_version = "1"
language = "any"
outcome = "test-coverage-withdrawal"
tier = "N"
citation = "Novel. No study underlies it. Motivated by PREMORTEM S1: a measured system whose tests are also the measurement's subject can be improved by removing the subject."
population = "none — calibrated against Andon's own corpus v1, which is a test set and not a study population"
effect = "none claimed; the net count of test cases the change removes, plus the count it newly marks skipped, across the whole changed set"
does_not_predict = [
    "that the removal was illegitimate — deleting the tests for a deleted feature is correct",
    "defect density",
    "the quality of the tests that remain",
    "removals in languages this engine has no grammar for",
]
owner = "gtm-k"
expiry = "2027-03-15"

