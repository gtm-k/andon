# Evidence registry for the clone-detection engine (P3).
#
# ONE CLAIM, FIVE METRICS
# -----------------------
# The five metrics are one measurement asked at three granularities and two
# framings: how many tokens of the measured set are covered by a confirmed
# clone (whole set, per file, and as a proportion), and how that duplication is
# arranged (how many distinct sequences, and how long the longest is). They
# share an implementation, a version, a normalization, and a window; splitting
# them would spend a budget of 24 (PREMORTEM S2) on distinctions no re-reviewer
# would evaluate separately, and the wave allocation gives P3 seven tuples for
# both engines.
#
# TIER N, AND THE FIELDS SAY WHY
# ------------------------------
# Duplication has a literature; *this implementation's* numbers do not. Tier N
# is the registry's word for "novel and unvalidated — motivated by evidence, not
# yet supported by it", which is exactly the standing of a token-normalized
# Rabin-Karp detector at window 25 / floor 50 tokens that nobody has evaluated
# against an outcome. Claiming tier B on the strength of somebody else's clone
# study would be the family-wide overstatement the claim tuple exists to make
# impossible.
#
# That is also what makes the merge above honest rather than convenient. The
# hazard a narrow claim guards against is attributing a study about one
# measurement to a family of measurements. There is no study here to stretch:
# `population` is "none", and `effect` enumerates what each metric counts.
#
# PREVALENCE IS NOT REMEDIATION BENEFIT
# -------------------------------------
# The clone literature that exists reports how much duplication is out there and
# how it correlates with inconsistent change. None of it says that removing a
# given clone improves anything, and a measurement tool that let that inference
# be drawn would be selling a refactor it cannot justify. `does_not_predict`
# says so in the first two entries rather than leaving it to be inferred.
#
# `citation_ref` is deliberately absent. The P10a registry gate resolves DOIs
# automatically, and an unverified identifier written from memory is a worse
# artefact than a named paper with no identifier: the first looks checked.

schema_version = 1
engine = "clones"
family = "clones"

[[metric]]
metric_id = "clones.duplicated-tokens"
claim_id = "andon.clones.token-duplication@1|any|token-duplication"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "clones.duplicated-token-ratio"
claim_id = "andon.clones.token-duplication@1|any|token-duplication"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "clones.file-duplicated-tokens"
claim_id = "andon.clones.token-duplication@1|any|token-duplication"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "clones.clone-groups"
claim_id = "andon.clones.token-duplication@1|any|token-duplication"
class = "diff-actionable"
deterministic = true

[[metric]]
metric_id = "clones.largest-clone-tokens"
claim_id = "andon.clones.token-duplication@1|any|token-duplication"
class = "diff-actionable"
deterministic = true

[[claim]]
claim_id = "andon.clones.token-duplication@1|any|token-duplication"
implementation = "andon.clones.token-duplication"
implementation_version = "1"
# `any` rather than one claim per grammar: the measurement is over a normalized
# token stream in which identifiers, literals, and comments have already been
# collapsed, so what is counted is language-independent by construction. The
# grammars differ in what they tokenize, and that difference is carried in the
# `measurement_regime`, not in the claim.
language = "any"
outcome = "token-duplication"
tier = "N"
citation = "Novel. Motivated by Juergens, Deissenboeck, Hummel and Wagner, 'Do Code Clones Matter?', ICSE 2009, which found inconsistent changes to cloned code associated with faults. That finding is about clones in general and about their study's systems; no study evaluates this detector, and none of the clone literature establishes that removing a given clone improves anything."
population = "none — no study underlies these numbers. They are exact counts over the file set the caller supplied, not estimates of anything."
effect = "none claimed. Five counts over the measured set: tokens covered by at least one confirmed clone fragment of 50 tokens or more, the same per file, that count as a proportion of all tokens measured, the number of distinct normalized sequences appearing two or more times, and the length of the longest."
does_not_predict = [
    "that removing the duplication would improve anything — the literature reports prevalence and co-change, not remediation benefit, and an extracted abstraction can be worse than the repetition it replaces",
    "which of two copies is the original, or which should change",
    "defect density, maintainability, or review effort",
    "duplication outside the measured file set, which the number never looked at",
]
owner = "gtm-k"
expiry = "2027-03-15"
