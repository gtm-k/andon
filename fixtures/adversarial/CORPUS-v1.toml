# Corpus v1 — the freeze marker.
#
# PLAN.md P3: the corpus is frozen and ensemble-reviewed BEFORE the precision and
# recall floors are measured against it, so that the test and its subject are not
# authored in one motion. This file records what was frozen.
#
# `digest` is a SHA-256 over every case file and manifest in both corpora, sorted by
# path. `andon-corpus-report --check-freeze` recomputes it and refuses to publish a
# report describing a corpus that has moved. Editing a case after the freeze is not a
# lint failure to be waved through: it invalidates the published numbers, and the
# order is always re-freeze then re-measure, never the reverse.
#
# `refresh_due` is the quarterly refresh of PREMORTEM S1, checked by the scheduled
# `corpus-refresh` workflow. An adversarial corpus that never changes becomes the
# evasion training set for whoever reads it.
#
# Generated by `andon-corpus-report freeze`. Do not hand-edit the digest.

