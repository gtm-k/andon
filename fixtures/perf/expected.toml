# Pinned commit OIDs for the perf fixture.
#
# `fixtures/perf/generate.sh` verifies the repository it builds against these and
# refuses to hand it to the gate if they differ. That is what makes the diff
# series "pinned": not a promise in a comment, but a hash the generator checks.
#
# Every input to these OIDs is fixed — the seeded content, the paths, the author
# and committer identity, and both timestamps — so they hold on Linux, macOS, and
# Windows alike. If a run reports a mismatch, the fixture definition changed and
# the perf numbers stop being comparable with the previous run's. Regenerate with
# `./fixtures/perf/generate.sh --print-oids`, and ledger the budget implications
# rather than refreshing the pins quietly.
#
# Recorded 2026-08-17 from git 2.39.0 on Windows; cross-checked on the Linux leg
# of `.github/workflows/perf.yml`, which runs the same verification.

