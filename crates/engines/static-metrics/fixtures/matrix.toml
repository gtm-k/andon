[[commit]]
label = "base"
message = "fixture: the base tree"

[[commit.file]]
path = "src/clean.ts"
text = "// A clean TypeScript file, LF throughout.\nexport function classify(value: number): string {\n  if (value > 10) {\n    return \"big\";\n  }\n  return \"small\";\n}\n"

[[commit.file]]
path = "src/crlf.ts"
text = "// CRLF in the blob, on purpose.\r\nexport function shout(text: string): string {\r\n  return text.toUpperCase();\r\n}\r\n"

[[commit.file]]
path = "src/mixed.py"
text = "# Both line endings, in one file.\r\ndef classify(value):\n    if value > 10:\r\n        return \"big\"\n    return \"small\"\r\n"

[[commit.file]]
path = "src/伝票/計測.py"
text = "# A non-ASCII path. The path is inside the per-result digest.\ndef total(rows):\n    return sum(rows)\n"

[[commit.file]]
path = "src/lib.rs"
text = "//! The tokenization tier.\n\npub fn describe(text: &str) -> &str {\n    let pattern = r\"// not a comment\";\n    if text.is_empty() { pattern } else { text }\n}\n"

[[commit.file]]
path = "src/gone.tsx"
text = "export const Widget = () => null;\n"

[[commit.file]]
path = "docs/notes.md"
text = "# Notes\n\nThis file is out of scope for the static family.\n"

