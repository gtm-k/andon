[[commit]]
label = "change"
message = "fixture: the measured change"
remove = ["src/gone.tsx"]

[[commit.file]]
path = "src/clean.ts"
text = "// A clean TypeScript file, LF throughout.\nexport function classify(value: number): string {\n  if (value > 10) {\n    return \"big\";\n  }\n  return \"small\";\n}\n\nexport function summarize(rows: number[]): number {\n  let total = 0;\n  for (const row of rows) {\n    if (row > 0 && row < 100) {\n      total += row;\n    }\n  }\n  return total;\n}\n"

