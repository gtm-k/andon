[package]
name = "andon-engine-clones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
andon-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tree-sitter = "=0.26.12"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
proptest = "1"

# The matrix probe. A binary rather than a test because the cross-OS gate runs
# it on three runners and compares the records it writes; a test would compare
# nothing across machines.
[[bin]]
name = "andon-clones-probe"
path = "src/bin/andon-clones-probe.rs"
