[package]
name = "andon-core"
description = "Andon measurement contract: payload schema v1, canonical serialization, engine trait, evidence registry, policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1"
# Test-only. The git tests build real repositories — there is no way to prove
# that a hostile gitconfig changes nothing without a repository and a hostile
# gitconfig — and each needs its own directory that disappears afterwards.
tempfile = "3"

# The perf-fixture generator. An example rather than a crate: it is developer
# tooling for one gate, and a new workspace member would need a manifest, a
# licence header, and a place in the dependency graph to earn nothing.
[[example]]
name = "gen_perf_fixture"
path = "examples/gen_perf_fixture.rs"
